name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    env:
      # 95% of the 0x280000 app partition.
      MAX_APP_BYTES: 2490368
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags give the firmware its version

      - name: Resolve dependencies
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The git dependency hashes in dependencies.lock cover files as
          # checked out with CRLF line endings.
          git config --global core.autocrlf true
          . "$IDF_PATH/export.sh"
          idf.py reconfigure

      - name: Check dependency lock is unchanged
        shell: bash
        run: git diff --exit-code dependencies.lock

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          echo "Version: $(git describe --tags --always --dirty)" >> "$GITHUB_STEP_SUMMARY"
          idf.py build

      - name: Merge flash image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd build
          python -m esptool --chip esp32s3 merge_bin -o leaf_os-merged.bin @flash_args

      - name: Check app size
        shell: bash
        run: |
          size=$(stat -c %s build/leaf_os.bin)
          echo "App image: $size bytes (limit $MAX_APP_BYTES)"
          echo "App image: $size / $MAX_APP_BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -le "$MAX_APP_BYTES"

      - uses: actions/upload-artifact@v4
        with:
          name: leaf-os-firmware
          path: |
            build/leaf_os.bin
            build/leaf_os-merged.bin
            build/leaf_os.elf
            build/leaf_os.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
          if-no-files-found: error

  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S tests -B build/host
          cmake --build build/host --parallel

      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  lua-apps:
    name: Lua app syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check syntax
        run: find apps -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

  catalog:
    name: App catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # --base compares against the target branch

      - name: Validate apps and build the catalog
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=()
          [[ -n "$BASE_REF" ]] && args+=(--base "origin/$BASE_REF")
          python3 tools/apps/build_catalog.py --out site "${args[@]}"

      - name: Build the firmware feed from the latest release (dry run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1                   --json tagName --jq '.[0].tagName // empty')
          [[ -z "$tag" ]] && { echo "no release yet"; exit 0; }
          gh release download "$tag" --pattern '*-update.zip' --dir dl
          python3 tools/release/build_feed.py --tag "$tag" --zip "dl/leaf-os-${tag}-update.zip" --out site
