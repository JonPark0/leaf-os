name: Pages

# The site holds the app catalog (catalog/v1/) and the firmware update feed
# (firmware/v1/). A deploy replaces the whole site, so every run builds both.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "tools/apps/**"
      - "tools/release/build_feed.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the catalog
        run: python3 tools/apps/build_catalog.py --out site

      - name: Build the firmware feed from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1                   --json tagName --jq '.[0].tagName // empty')
          if [[ -z "$tag" ]]; then
            echo "no release yet; skipping the firmware feed"
            exit 0
          fi
          gh release download "$tag" --pattern '*-update.zip' --dir dl
          python3 tools/release/build_feed.py --tag "$tag" --zip "dl/leaf-os-${tag}-update.zip"             --notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}catalog/v1/index.json
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
